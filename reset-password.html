<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Nowe hasło · Tanko</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <section class="auth-shell">
    <div class="brand-lockup"><div class="brand-mark">T</div><span class="brand-dot"></span></div>
    <h1>Ustaw nowe hasło</h1>
    <p class="muted center">Wpisz nowe hasło do swojego konta Tanko.</p>
    <div class="auth-card">
      <form id="newPasswordForm">
        <label>Nowe hasło<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="minimum 8 znaków" /></label>
        <label>Powtórz hasło<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button class="primary wide" type="submit" id="savePassword">Zapisz nowe hasło</button>
      </form>
      <a class="link-btn" style="display:block;text-align:center;margin-top:12px" href="./">Wróć do logowania</a>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const cfg=window.APP_CONFIG||{};
    const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    const toast=(msg)=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)};

    async function ensureRecoverySession(){
      const params=new URLSearchParams(location.hash.replace(/^#/,''));
      const err=params.get('error_description');
      if(err){toast(decodeURIComponent(err.replace(/\+/g,' ')));return false}
      const {data:{session}}=await sb.auth.getSession();
      if(session)return true;
      await new Promise(resolve=>setTimeout(resolve,500));
      const second=await sb.auth.getSession();
      return !!second.data.session;
    }

    document.getElementById('newPasswordForm').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const pass=document.getElementById('newPassword').value;
      const confirm=document.getElementById('confirmPassword').value;
      if(pass.length<8)return toast('Hasło musi mieć co najmniej 8 znaków.');
      if(pass!==confirm)return toast('Hasła nie są takie same.');
      const ok=await ensureRecoverySession();
      if(!ok)return toast('Link jest nieważny lub wygasł. Poproś o nowy link z ekranu logowania.');
      const btn=document.getElementById('savePassword');btn.disabled=true;btn.textContent='Zapisywanie…';
      const {error}=await sb.auth.updateUser({password:pass});
      if(error){btn.disabled=false;btn.textContent='Zapisz nowe hasło';return toast(error.message)}
      await sb.auth.signOut();
      location.replace('https://frano-web.github.io/Tanko/?password=changed');
    });

    sb.auth.onAuthStateChange((event,session)=>{
      if((event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')&&session){
        history.replaceState({},document.title,location.pathname);
      }
    });
  </script>
</body>
</html>
