<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07140f" />
  <meta name="description" content="Ustaw nowe hasło w Tanko." />
  <title>Nowe hasło • Tanko</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="recovery-page">
  <div id="toast" class="toast" aria-live="polite"></div>
  <main class="recovery-shell">
    <a class="recovery-brand" href="./" aria-label="Tanko — strona główna">
      <span class="logo-orb">T</span>
      <span>Tanko</span>
    </a>

    <section class="recovery-card">
      <div class="recovery-icon">🔐</div>
      <span class="eyebrow">BEZPIECZEŃSTWO KONTA</span>
      <h1>Ustaw nowe hasło</h1>
      <p class="muted">Wprowadź nowe hasło do swojego konta.</p>

      <form id="newPasswordForm" class="stack-form">
        <label>Nowe hasło
          <div class="password-field">
            <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimum 8 znaków" />
            <button type="button" class="password-toggle" data-toggle="newPassword" aria-label="Pokaż hasło">◉</button>
          </div>
        </label>
        <label>Powtórz hasło
          <div class="password-field">
            <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Powtórz nowe hasło" />
            <button type="button" class="password-toggle" data-toggle="confirmPassword" aria-label="Pokaż hasło">◉</button>
          </div>
        </label>
        <button class="primary wide" type="submit" id="savePasswordBtn">Zapisz nowe hasło</button>
      </form>

      <a class="back-link" href="./">← Wróć do logowania</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
