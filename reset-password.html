<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07140f" />
  <title>Nowe hasło · Tanko</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="recovery-page">
  <div id="toast" class="toast" aria-live="polite"></div>
  <main class="recovery-shell">
    <div class="fuel-logo" style="margin:0 auto 18px"><svg viewBox="0 0 64 64"><path d="M13 8h25a6 6 0 0 1 6 6v42H7V14a6 6 0 0 1 6-6Z"/><path d="M44 20h5l7 8v19a5 5 0 0 1-10 0V34"/><path d="M14 15h23v15H14z"/><path d="M12 56h34"/></svg></div>
    <section class="recovery-card">
      <span class="eyebrow">BEZPIECZEŃSTWO KONTA</span>
      <h1>Ustaw nowe hasło</h1>
      <p class="muted">Wpisz nowe hasło. Po zapisaniu wrócisz do ekranu logowania.</p>
      <form id="newPasswordForm" class="stack-form">
        <label>Nowe hasło<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="minimum 8 znaków" /></label>
        <label>Powtórz hasło<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button class="primary wide" type="submit" id="savePassword">Zapisz nowe hasło</button>
      </form>
      <a class="back-link" href="./">Wróć do logowania</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const cfg=window.APP_CONFIG||{};
    const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    const toast=msg=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)};
    document.getElementById('newPasswordForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const pass=document.getElementById('newPassword').value, confirm=document.getElementById('confirmPassword').value;
      if(pass.length<8)return toast('Hasło musi mieć co najmniej 8 znaków.');
      if(pass!==confirm)return toast('Hasła nie są takie same.');
      const {data:{session}}=await sb.auth.getSession();
      if(!session)return toast('Link jest nieważny lub wygasł. Poproś o nowy link.');
      const btn=document.getElementById('savePassword');btn.disabled=true;btn.textContent='Zapisywanie…';
      const {error}=await sb.auth.updateUser({password:pass});
      if(error){btn.disabled=false;btn.textContent='Zapisz nowe hasło';return toast(error.message)}
      await sb.auth.signOut();location.replace('https://frano-web.github.io/Tanko/?password=changed');
    });
  </script>
</body>
</html>
